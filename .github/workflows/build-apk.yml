name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fix flat layout if needed
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "Project layout is already correct, skipping repair"
            exit 0
          fi
          echo "Flat layout detected, rebuilding app/ structure..."
          mkdir -p app/src/main/java/com/mahin/azu/data/model
          mkdir -p app/src/main/java/com/mahin/azu/data/repository
          mkdir -p app/src/main/java/com/mahin/azu/data/receiver
          mkdir -p app/src/main/java/com/mahin/azu/ui/screens
          mkdir -p app/src/main/java/com/mahin/azu/ui/theme
          mkdir -p app/src/main/java/com/mahin/azu/ui/viewmodel
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/mahin/azu/
          [ -f AzuApp.kt ] && mv AzuApp.kt app/src/main/java/com/mahin/azu/
          [ -f AppModel.kt ] && mv AppModel.kt app/src/main/java/com/mahin/azu/data/model/
          [ -f AppRepository.kt ] && mv AppRepository.kt app/src/main/java/com/mahin/azu/data/repository/
          [ -f PackageChangeReceiver.kt ] && mv PackageChangeReceiver.kt app/src/main/java/com/mahin/azu/data/receiver/
          [ -f AppDrawerScreen.kt ] && mv AppDrawerScreen.kt app/src/main/java/com/mahin/azu/ui/screens/
          [ -f HomeScreen.kt ] && mv HomeScreen.kt app/src/main/java/com/mahin/azu/ui/screens/
          [ -f Color.kt ] && mv Color.kt app/src/main/java/com/mahin/azu/ui/theme/
          [ -f Theme.kt ] && mv Theme.kt app/src/main/java/com/mahin/azu/ui/theme/
          [ -f LauncherViewModel.kt ] && mv LauncherViewModel.kt app/src/main/java/com/mahin/azu/ui/viewmodel/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
          [ -f ic_launcher.xml ] && mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
          [ -f proguard-rules.pro ] && mv proguard-rules.pro app/proguard-rules.pro
          [ -f build.gradle.kts ] && mv build.gradle.kts app/build.gradle.kts
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
          cat > build.gradle.kts <<'EOF'
          // Project-level build file for A-ZU
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          echo "After repair:"
          find . -type f | sort

      - name: Remove invalid Compose plugin
        run: |
          sed -i '/org.jetbrains.kotlin.plugin.compose/d' app/build.gradle.kts build.gradle.kts 2>/dev/null || true
          echo "--- root build.gradle.kts ---"; cat build.gradle.kts
          echo "--- app/build.gradle.kts (plugins block) ---"; head -n 8 app/build.gradle.kts

      - name: Check project files are present
        run: |
          test -f settings.gradle.kts || (echo "ERROR: settings.gradle.kts not found at repo root." && exit 1)
          test -f app/build.gradle.kts || (echo "ERROR: app/build.gradle.kts not found." && exit 1)
          test -f app/src/main/AndroidManifest.xml || (echo "ERROR: app/src/main/AndroidManifest.xml not found." && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/Android/Sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          ls $ANDROID_HOME

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
          cache-disabled: true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace > build.log 2>&1 || (tail -n 200 build.log; exit 1)

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: List built APK
        run: ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: A-ZU-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
